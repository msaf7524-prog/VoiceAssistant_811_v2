name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            ccache lld python3-dev python3-pip python3-setuptools

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3" buildozer virtualenv

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "893704667450112217b71379d972d473970d8419\n24333f8a63717208d132635a9cc5f67a21b3693e\n504667450112217b71379d972d473970d8419\ncd50112217b71379d972d473970d8419" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84449eb562853f314e6a06b12743637de96b92f" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-811-APK
          path: bin/*.apk
